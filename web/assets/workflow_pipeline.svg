<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 724" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8A9590"/></marker><marker id="arrg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2E5B4F"/></marker></defs><rect width="1180" height="724" fill="white"/><text x="590" y="34" font-size="21" fill="#1F4E42" font-weight="bold" text-anchor="middle">Branch B Methodology — Two-Stage Localization-First Production Pipeline</text><text x="590" y="56" font-size="14" fill="#8A9590" text-anchor="middle">Step numbers S1-S5 match the panels in the WasteWise web GUI</text><rect x="330" y="80" width="520" height="56" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><rect x="340" y="89" width="34" height="20" rx="10" fill="#2E5B4F"/><text x="357.0" y="103" font-size="12" font-weight="bold" fill="white" text-anchor="middle">S1</text><text x="382" y="104" font-size="15" font-weight="bold" fill="#1F2937">Input image</text><text x="342" y="124" font-size="12.5" fill="#374151">user upload (web GUI) - BGR, any resolution</text><path d="M590.0,136 L590.0,162" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><rect x="330" y="162" width="520" height="74" rx="10" fill="#FDF1E3" stroke="#E8871E" stroke-width="1.6"/><rect x="340" y="171" width="34" height="20" rx="10" fill="#E8871E"/><text x="357.0" y="185" font-size="12" font-weight="bold" fill="white" text-anchor="middle">S2</text><text x="382" y="186" font-size="15" font-weight="bold" fill="#1F2937">Stage 1 - YOLO object proposal</text><text x="342" y="206" font-size="12.5" fill="#374151">YOLOv11, conf 0.30, imgsz 960, max 80 detections</text><text x="342" y="223" font-size="12.5" fill="#374151">output: candidate boxes + YOLO class + confidence</text><rect x="30" y="162" width="250" height="120" rx="10" fill="#FBEAEA" stroke="#B23A48" stroke-width="1.6"/><text x="155.0" y="184" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Adaptive scene engine</text><text x="155.0" y="203" font-size="11.5" fill="#374151" text-anchor="middle">0 boxes -&gt; SMALL_OBJECT_RECOVERY:</text><text x="155.0" y="220" font-size="11.5" fill="#374151" text-anchor="middle">re-run YOLO at conf 0.05,</text><text x="155.0" y="237" font-size="11.5" fill="#374151" text-anchor="middle">CNN limit relaxed to 0.15</text><text x="155.0" y="254" font-size="11.5" fill="#374151" text-anchor="middle">&gt;= 8 boxes -&gt; DENSE_CLUTTER:</text><text x="155.0" y="271" font-size="11.5" fill="#374151" text-anchor="middle">CNN limit 0.20</text><path d="M280,222 L280,216.0 L330,216.0 L330,210" fill="none" stroke="#B23A48" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/><path d="M590.0,236 L590.0,262" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><rect x="330" y="262" width="520" height="74" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><rect x="340" y="271" width="34" height="20" rx="10" fill="#2E5B4F"/><text x="357.0" y="285" font-size="12" font-weight="bold" fill="white" text-anchor="middle">S3</text><text x="382" y="286" font-size="15" font-weight="bold" fill="#1F2937">Crop extraction &amp; filtering</text><text x="342" y="306" font-size="12.5" fill="#374151">physical size filter: reject boxes &lt; 24 x 24 px</text><text x="342" y="323" font-size="12.5" fill="#374151">pad each surviving box by 10 px, cut crop</text><path d="M590.0,336 L590.0,362" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><rect x="330" y="362" width="520" height="74" rx="10" fill="#FDF1E3" stroke="#E8871E" stroke-width="1.6"/><rect x="340" y="371" width="34" height="20" rx="10" fill="#E8871E"/><text x="357.0" y="385" font-size="12" font-weight="bold" fill="white" text-anchor="middle">S4</text><text x="382" y="386" font-size="15" font-weight="bold" fill="#1F2937">Stage 2 - crop verification classifier</text><text x="342" y="406" font-size="12.5" fill="#374151">ConvNeXt-Tiny embedding + standardized 637 features</text><text x="342" y="423" font-size="12.5" fill="#374151">batch inference -&gt; 7-class probabilities (incl. Background)</text><rect x="900" y="362" width="250" height="96" rx="10" fill="#E8EFF7" stroke="#3A6EA5" stroke-width="1.6"/><text x="1025.0" y="384" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Multimodal fusion</text><text x="1025.0" y="403" font-size="11.5" fill="#374151" text-anchor="middle">image embedding and</text><text x="1025.0" y="420" font-size="11.5" fill="#374151" text-anchor="middle">handcrafted features are</text><text x="1025.0" y="437" font-size="11.5" fill="#374151" text-anchor="middle">concatenated inside one</text><text x="1025.0" y="454" font-size="11.5" fill="#374151" text-anchor="middle">network head</text><path d="M900,410 L900,405.0 L850,405.0 L850,400" fill="none" stroke="#3A6EA5" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/><path d="M590.0,436 L590.0,462" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><rect x="330" y="462" width="520" height="116" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><rect x="340" y="471" width="34" height="20" rx="10" fill="#2E5B4F"/><text x="357.0" y="485" font-size="12" font-weight="bold" fill="white" text-anchor="middle">S5</text><text x="382" y="486" font-size="15" font-weight="bold" fill="#1F2937">Score fusion, context priors &amp; routing</text><text x="342" y="506" font-size="12.5" fill="#374151">dynamic alpha: score = a*YOLO + (1-a)*CNN</text><text x="342" y="523" font-size="12.5" fill="#374151">a = 0.70 if YOLO &gt;= 0.65; 0.40 if &gt;= 0.30; else 0.15</text><text x="342" y="540" font-size="12.5" fill="#374151">HSV scene detector -&gt; Bayesian prior (Beach/Grass/Street/Indoor)</text><text x="342" y="560" font-size="12.5" fill="#374151">bottom-up aggregation -&gt; dominant material -&gt; bin route lookup</text><rect x="30" y="470" width="250" height="100" rx="10" fill="#E8EFF7" stroke="#3A6EA5" stroke-width="1.6"/><text x="155.0" y="492" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Context priors</text><text x="155.0" y="511" font-size="11.5" fill="#374151" text-anchor="middle">Beach  [.35 .25 .20 .05 .05 .10]</text><text x="155.0" y="528" font-size="11.5" fill="#374151" text-anchor="middle">Grass  [.30 .15 .15 .20 .05 .15]</text><text x="155.0" y="545" font-size="11.5" fill="#374151" text-anchor="middle">Indoor [.20 .10 .15 .30 .20 .05]</text><text x="155.0" y="562" font-size="11.5" fill="#374151" text-anchor="middle">Street [.30 .15 .15 .20 .10 .10]</text><path d="M280,520 L280,517.5 L330,517.5 L330,515" fill="none" stroke="#3A6EA5" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/><path d="M590.0,578 L590.0,596" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><rect x="330" y="596" width="520" height="60" rx="10" fill="#DCE9E4" stroke="#1F4E42" stroke-width="1.6"/><text x="590.0" y="618" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Output</text><text x="590.0" y="637" font-size="12.5" fill="#374151" text-anchor="middle">boxes + verified labels, 7-class scores, top-3, context,</text><text x="590.0" y="654" font-size="12.5" fill="#374151" text-anchor="middle">dominant material, bin route, latency - rendered step-by-step in GUI</text><rect x="900" y="584" width="250" height="120" rx="10" fill="#FDF1E3" stroke="#E8871E" stroke-width="1.6"/><text x="1025.0" y="606" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Evaluation</text><text x="1025.0" y="625" font-size="11.5" fill="#374151" text-anchor="middle">localization: precision,</text><text x="1025.0" y="642" font-size="11.5" fill="#374151" text-anchor="middle">recall, F1, matched IoU</text><text x="1025.0" y="659" font-size="11.5" fill="#374151" text-anchor="middle">promoted point: conf 0.30</text><text x="1025.0" y="676" font-size="11.5" fill="#374151" text-anchor="middle">P .700 R .573 IoU .906</text><path d="M850,640 L850,635.0 L900,635.0 L900,630" fill="none" stroke="#8A9590" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/></svg>