<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8A9590"/></marker><marker id="arrg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2E5B4F"/></marker></defs><rect width="1180" height="760" fill="white"/><text x="590" y="34" font-size="22" fill="#1F4E42" font-weight="bold" text-anchor="middle">WasteWise — Overall Project Workflow</text><rect x="40" y="60" width="250" height="78" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><text x="165.0" y="82" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">1. Data acquisition</text><text x="165.0" y="101" font-size="12.5" fill="#374151" text-anchor="middle">Roboflow x6, TrashNet, GINI,</text><text x="165.0" y="118" font-size="12.5" fill="#374151" text-anchor="middle">TACO official, RealWaste, Trashify</text><rect x="340" y="60" width="240" height="78" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><text x="460.0" y="82" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">2. EDA &amp; audit</text><text x="460.0" y="101" font-size="12.5" fill="#374151" text-anchor="middle">class balance, box areas, duplicates,</text><text x="460.0" y="118" font-size="12.5" fill="#374151" text-anchor="middle">invalid labels, frequency analysis</text><rect x="630" y="60" width="250" height="78" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><text x="755.0" y="82" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">3. Cleaning &amp; rebuild</text><text x="755.0" y="101" font-size="12.5" fill="#374151" text-anchor="middle">dedup, drop invalid rows, tiny-box</text><text x="755.0" y="118" font-size="12.5" fill="#374151" text-anchor="middle">filter, split rebuild, per-class caps</text><rect x="930" y="60" width="210" height="78" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><text x="1035.0" y="82" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">4. Final datasets</text><text x="1035.0" y="101" font-size="12.5" fill="#374151" text-anchor="middle">merged_v5 (29,639 crops, 7 cls)</text><text x="1035.0" y="118" font-size="12.5" fill="#374151" text-anchor="middle">super_yolo (102,777 boxes)</text><path d="M290,99 L340,99" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M580,99 L630,99" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M880,99 L930,99" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1035,138 L1035,170" fill="none" stroke="#2E5B4F" stroke-width="1.8" marker-end="url(#arrg)"/><path d="M1035,170 L1035,187.5 L300,187.5 L300,205" fill="none" stroke="#2E5B4F" stroke-width="1.8" marker-end="url(#arrg)"/><path d="M1035,170 L1035,187.5 L880,187.5 L880,205" fill="none" stroke="#2E5B4F" stroke-width="1.8" marker-end="url(#arrg)"/><text x="300" y="196" font-size="17" fill="#1F4E42" font-weight="bold" text-anchor="middle">Branch A — Explainable classical ML</text><rect x="120" y="210" width="360" height="64" rx="10" fill="#E8EFF7" stroke="#3A6EA5" stroke-width="1.6"/><text x="300.0" y="232" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">A1. Object crops</text><text x="300.0" y="251" font-size="12.5" fill="#374151" text-anchor="middle">crop each labelled box, resize 64 x 64</text><rect x="120" y="306" width="360" height="82" rx="10" fill="#E8EFF7" stroke="#3A6EA5" stroke-width="1.6"/><text x="300.0" y="328" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">A2. 637 handcrafted features</text><text x="300.0" y="347" font-size="12.5" fill="#374151" text-anchor="middle">8 spatial + 9 FFT + 44 color + 576 HOG</text><text x="300.0" y="364" font-size="12.5" fill="#374151" text-anchor="middle">features first, interpretation second, ML third</text><rect x="120" y="420" width="360" height="82" rx="10" fill="#E8EFF7" stroke="#3A6EA5" stroke-width="1.6"/><text x="300.0" y="442" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">A3. Model comparison</text><text x="300.0" y="461" font-size="12.5" fill="#374151" text-anchor="middle">DT, LogReg, LinearSVM, RF, ExtraTrees, XGBoost</text><text x="300.0" y="478" font-size="12.5" fill="#374151" text-anchor="middle">balanced caps 4,000/class, support recorded</text><rect x="120" y="534" width="360" height="78" rx="10" fill="#E8EFF7" stroke="#3A6EA5" stroke-width="1.6"/><text x="300.0" y="556" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">A4. Evaluation + PCA sweep</text><text x="300.0" y="575" font-size="12.5" fill="#374151" text-anchor="middle">accuracy, macro-F1, confusion, importance</text><text x="300.0" y="592" font-size="12.5" fill="#374151" text-anchor="middle">PCA 16 - 637 dims, per-model trade-off</text><rect x="120" y="644" width="360" height="58" rx="10" fill="#DCE9E4" stroke="#1F4E42" stroke-width="1.6"/><text x="300.0" y="666" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">A5. Explainable evidence</text><text x="300.0" y="685" font-size="12.5" fill="#374151" text-anchor="middle">XGBoost 0.6742 - PCA knee 128-D</text><path d="M300,274 L300,306" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M300,388 L300,420" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M300,502 L300,534" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M300,612 L300,644" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><text x="880" y="196" font-size="17" fill="#1F4E42" font-weight="bold" text-anchor="middle">Branch B — Deep-learning production</text><rect x="700" y="210" width="360" height="64" rx="10" fill="#FDF1E3" stroke="#E8871E" stroke-width="1.6"/><text x="880.0" y="232" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">B1. YOLO localizer training</text><text x="880.0" y="251" font-size="12.5" fill="#374151" text-anchor="middle">YOLOv8n -&gt; YOLOv11 -&gt; YOLO26 benchmark</text><rect x="700" y="306" width="360" height="82" rx="10" fill="#FDF1E3" stroke="#E8871E" stroke-width="1.6"/><text x="880.0" y="328" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">B2. Two-stage pipeline</text><text x="880.0" y="347" font-size="12.5" fill="#374151" text-anchor="middle">Stage 1: YOLO proposes boxes (localize first)</text><text x="880.0" y="364" font-size="12.5" fill="#374151" text-anchor="middle">Stage 2: ConvNeXt + 637 verifies each crop</text><rect x="700" y="420" width="360" height="82" rx="10" fill="#FDF1E3" stroke="#E8871E" stroke-width="1.6"/><text x="880.0" y="442" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">B3. Decision logic</text><text x="880.0" y="461" font-size="12.5" fill="#374151" text-anchor="middle">alpha blending, consensus thresholds,</text><text x="880.0" y="478" font-size="12.5" fill="#374151" text-anchor="middle">adaptive scene engine, Bayesian context priors</text><rect x="700" y="534" width="360" height="78" rx="10" fill="#FDF1E3" stroke="#E8871E" stroke-width="1.6"/><text x="880.0" y="556" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">B4. Localization evaluation</text><text x="880.0" y="575" font-size="12.5" fill="#374151" text-anchor="middle">precision, recall, F1, matched IoU, mAP</text><text x="880.0" y="592" font-size="12.5" fill="#374151" text-anchor="middle">Grad-CAM baseline vs YOLO (300 images)</text><rect x="700" y="644" width="360" height="58" rx="10" fill="#F6E3CB" stroke="#B96A12" stroke-width="1.6"/><text x="880.0" y="666" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">B5. Production web app</text><text x="880.0" y="685" font-size="12.5" fill="#374151" text-anchor="middle">Flask-style API + Docker + HF Spaces</text><path d="M880,274 L880,306" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M880,388 L880,420" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M880,502 L880,534" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M880,612 L880,644" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M480,337 L480,342.0 L700,342.0 L700,347" fill="none" stroke="#2E5B4F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrg)"/><text x="590" y="330" font-size="12" fill="#2E5B4F" text-anchor="middle" font-style="italic">same 637 features fused into Stage 2</text></svg>