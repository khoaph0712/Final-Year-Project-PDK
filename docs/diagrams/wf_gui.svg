<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 430" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8A9590"/></marker><marker id="arrg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2E5B4F"/></marker></defs><rect width="1250" height="430" fill="white"/><text x="625" y="34" font-size="21" fill="#1F4E42" font-weight="bold" text-anchor="middle">GUI Workflow — one panel per pipeline step</text><rect x="30" y="90" width="175" height="150" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><rect x="40" y="99" width="34" height="20" rx="10" fill="#2E5B4F"/><text x="57.0" y="113" font-size="12" font-weight="bold" fill="white" text-anchor="middle">S1</text><text x="82" y="114" font-size="15" font-weight="bold" fill="#1F2937">Input</text><text x="42" y="134" font-size="12" fill="#374151">drag &amp; drop or</text><text x="42" y="151" font-size="12" fill="#374151">camera upload,</text><text x="42" y="168" font-size="12" fill="#374151">preview + source</text><path d="M205,165 L229,165" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><rect x="229" y="90" width="175" height="150" rx="10" fill="#FDF1E3" stroke="#E8871E" stroke-width="1.6"/><rect x="239" y="99" width="34" height="20" rx="10" fill="#E8871E"/><text x="256.0" y="113" font-size="12" font-weight="bold" fill="white" text-anchor="middle">S2</text><text x="281" y="114" font-size="15" font-weight="bold" fill="#1F2937">Localization</text><text x="241" y="134" font-size="12" fill="#374151">boxes drawn live</text><text x="241" y="151" font-size="12" fill="#374151">on the image,</text><text x="241" y="168" font-size="12" fill="#374151">conf + adaptive mode</text><path d="M404,165 L428,165" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><rect x="428" y="90" width="175" height="150" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><rect x="438" y="99" width="34" height="20" rx="10" fill="#2E5B4F"/><text x="455.0" y="113" font-size="12" font-weight="bold" fill="white" text-anchor="middle">S3</text><text x="480" y="114" font-size="15" font-weight="bold" fill="#1F2937">Crops</text><text x="440" y="134" font-size="12" fill="#374151">thumbnail strip of</text><text x="440" y="151" font-size="12" fill="#374151">extracted crops,</text><text x="440" y="168" font-size="12" fill="#374151">size-filter note</text><path d="M603,165 L627,165" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><rect x="627" y="90" width="175" height="150" rx="10" fill="#FDF1E3" stroke="#E8871E" stroke-width="1.6"/><rect x="637" y="99" width="34" height="20" rx="10" fill="#E8871E"/><text x="654.0" y="113" font-size="12" font-weight="bold" fill="white" text-anchor="middle">S4</text><text x="679" y="114" font-size="15" font-weight="bold" fill="#1F2937">Verification</text><text x="639" y="134" font-size="12" fill="#374151">per crop: YOLO vs</text><text x="639" y="151" font-size="12" fill="#374151">CNN label + conf,</text><text x="639" y="168" font-size="12" fill="#374151">agreement badge</text><path d="M802,165 L826,165" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><rect x="826" y="90" width="175" height="150" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><rect x="836" y="99" width="34" height="20" rx="10" fill="#2E5B4F"/><text x="853.0" y="113" font-size="12" font-weight="bold" fill="white" text-anchor="middle">S5</text><text x="878" y="114" font-size="15" font-weight="bold" fill="#1F2937">Context fusion</text><text x="838" y="134" font-size="12" fill="#374151">detected scene,</text><text x="838" y="151" font-size="12" fill="#374151">alpha used,</text><text x="838" y="168" font-size="12" fill="#374151">prior applied</text><path d="M1001,165 L1025,165" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><rect x="1025" y="90" width="175" height="150" rx="10" fill="#FDF1E3" stroke="#E8871E" stroke-width="1.6"/><rect x="1035" y="99" width="34" height="20" rx="10" fill="#E8871E"/><text x="1052.0" y="113" font-size="12" font-weight="bold" fill="white" text-anchor="middle">S6</text><text x="1077" y="114" font-size="15" font-weight="bold" fill="#1F2937">Decision</text><text x="1037" y="134" font-size="12" fill="#374151">waste state, bin</text><text x="1037" y="151" font-size="12" fill="#374151">route, top-3 scores,</text><text x="1037" y="168" font-size="12" fill="#374151">latency</text><rect x="240" y="300" width="700" height="74" rx="10" fill="#E8EFF7" stroke="#3A6EA5" stroke-width="1.6"/><text x="590.0" y="322" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Below the stepper: history timeline + evidence section</text><text x="590.0" y="341" font-size="12.5" fill="#374151" text-anchor="middle">every scan stores its full step trace; every number links to a repository artifact</text><path d="M590,240 L590,300" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/></svg>