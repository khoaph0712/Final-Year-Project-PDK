<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8A9590"/></marker><marker id="arrg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2E5B4F"/></marker></defs><rect width="1180" height="620" fill="white"/><text x="590" y="34" font-size="21" fill="#1F4E42" font-weight="bold" text-anchor="middle">Branch A Methodology — 637-Feature Explainable ML Pipeline</text><rect x="40" y="70" width="210" height="70" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><text x="145.0" y="92" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">YOLO-labelled data</text><text x="145.0" y="111" font-size="12.5" fill="#374151" text-anchor="middle">images + bounding boxes</text><text x="145.0" y="128" font-size="12.5" fill="#374151" text-anchor="middle">6 classes, &#x27;other&#x27; excluded</text><rect x="300" y="70" width="200" height="70" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><text x="400.0" y="92" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Crop &amp; resize</text><text x="400.0" y="111" font-size="12.5" fill="#374151" text-anchor="middle">cut each box</text><text x="400.0" y="128" font-size="12.5" fill="#374151" text-anchor="middle">resize to 64 x 64 px</text><rect x="550" y="70" width="250" height="70" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><text x="675.0" y="92" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Balanced sampling</text><text x="675.0" y="111" font-size="12.5" fill="#374151" text-anchor="middle">cap 4,000 train crops/class</text><text x="675.0" y="128" font-size="12.5" fill="#374151" text-anchor="middle">class_support.json recorded</text><rect x="850" y="70" width="290" height="70" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><text x="995.0" y="92" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Feature extraction (637-D)</text><text x="995.0" y="111" font-size="12.5" fill="#374151" text-anchor="middle">one fixed explainable vector per crop</text><path d="M250,105 L300,105" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M500,105 L550,105" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M800,105 L850,105" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="190" width="240" height="96" rx="10" fill="#E8EFF7" stroke="#3A6EA5" stroke-width="1.6"/><text x="180.0" y="212" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Spatial (8)</text><text x="180.0" y="231" font-size="12.5" fill="#374151" text-anchor="middle">mean/std intensity, p10/p50/p90,</text><text x="180.0" y="248" font-size="12.5" fill="#374151" text-anchor="middle">gradient mean/std, edge density</text><text x="180.0" y="265" font-size="12.5" fill="#374151" text-anchor="middle">-&gt; brightness &amp; edge structure</text><rect x="340" y="190" width="240" height="96" rx="10" fill="#E8EFF7" stroke="#3A6EA5" stroke-width="1.6"/><text x="460.0" y="212" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Frequency / FFT (9)</text><text x="460.0" y="231" font-size="12.5" fill="#374151" text-anchor="middle">8 radial energy bins +</text><text x="460.0" y="248" font-size="12.5" fill="#374151" text-anchor="middle">high-frequency energy</text><text x="460.0" y="265" font-size="12.5" fill="#374151" text-anchor="middle">-&gt; texture roughness signature</text><rect x="620" y="190" width="240" height="96" rx="10" fill="#E8EFF7" stroke="#3A6EA5" stroke-width="1.6"/><text x="740.0" y="212" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Color (44)</text><text x="740.0" y="231" font-size="12.5" fill="#374151" text-anchor="middle">HSV histograms + BGR/HSV</text><text x="740.0" y="248" font-size="12.5" fill="#374151" text-anchor="middle">channel mean &amp; std</text><text x="740.0" y="265" font-size="12.5" fill="#374151" text-anchor="middle">-&gt; material color statistics</text><rect x="900" y="190" width="240" height="96" rx="10" fill="#E8EFF7" stroke="#3A6EA5" stroke-width="1.6"/><text x="1020.0" y="212" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">HOG (576)</text><text x="1020.0" y="231" font-size="12.5" fill="#374151" text-anchor="middle">9-bin gradient orientation</text><text x="1020.0" y="248" font-size="12.5" fill="#374151" text-anchor="middle">histograms on 8x8 cells</text><text x="1020.0" y="265" font-size="12.5" fill="#374151" text-anchor="middle">-&gt; local shape &amp; texture</text><path d="M995,140 L995,165.0 L180,165.0 L180,190" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M995,140 L995,165.0 L460,165.0 L460,190" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M995,140 L995,165.0 L740,165.0 L740,190" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M995,140 L995,165.0 L1020,165.0 L1020,190" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><rect x="340" y="330" width="500" height="64" rx="10" fill="#EAF2EF" stroke="#2E5B4F" stroke-width="1.6"/><text x="590.0" y="352" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Feature matrix (N x 637) + StandardScaler</text><text x="590.0" y="371" font-size="12.5" fill="#374151" text-anchor="middle">fitted on train split only, applied to test</text><path d="M180,286 L180,308.0 L590,308.0 L590,330" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M460,286 L460,308.0 L590,308.0 L590,330" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M740,286 L740,308.0 L590,308.0 L590,330" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1020,286 L1020,308.0 L590,308.0 L590,330" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="440" width="480" height="92" rx="10" fill="#FDF1E3" stroke="#E8871E" stroke-width="1.6"/><text x="300.0" y="462" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Model comparison (identical features &amp; splits)</text><text x="300.0" y="481" font-size="12.5" fill="#374151" text-anchor="middle">Decision Tree, Logistic Regression, Linear SVM,</text><text x="300.0" y="498" font-size="12.5" fill="#374151" text-anchor="middle">Random Forest, ExtraTrees, XGBoost</text><text x="300.0" y="515" font-size="12.5" fill="#374151" text-anchor="middle">metrics: accuracy, macro-F1, confusion matrix, importance</text><rect x="640" y="440" width="480" height="92" rx="10" fill="#FDF1E3" stroke="#E8871E" stroke-width="1.6"/><text x="880.0" y="462" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">PCA dimensionality study</text><text x="880.0" y="481" font-size="12.5" fill="#374151" text-anchor="middle">project to 16/32/64/96/128/192/256/384 dims</text><text x="880.0" y="498" font-size="12.5" fill="#374151" text-anchor="middle">retrain every model per dimension</text><text x="880.0" y="515" font-size="12.5" fill="#374151" text-anchor="middle">report explained variance + per-model accuracy drop</text><path d="M470,394 L470,417.0 L300,417.0 L300,440" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M710,394 L710,417.0 L880,417.0 L880,440" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><rect x="340" y="566" width="500" height="44" rx="10" fill="#DCE9E4" stroke="#1F4E42" stroke-width="1.6"/><text x="590.0" y="588" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Explainable evidence pack</text><text x="590.0" y="607" font-size="12" fill="#374151" text-anchor="middle">best model + honest compression claim (128-D knee)</text><path d="M300,532 L300,549.0 L480,549.0 L480,566" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/><path d="M880,532 L880,549.0 L700,549.0 L700,566" fill="none" stroke="#8A9590" stroke-width="1.8" marker-end="url(#arr)"/></svg>